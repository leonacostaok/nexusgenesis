name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            echo "[Deploy] Logging into GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "[Deploy] Pulling latest image..."
            docker pull ghcr.io/${{ github.repository }}:latest

            echo "[Deploy] Stopping old container..."
            docker stop nexusgenesis-node 2>/dev/null || true
            docker rm nexusgenesis-node 2>/dev/null || true

            echo "[Deploy] Starting new container..."
            docker run -d \
              --name nexusgenesis-node \
              --restart unless-stopped \
              -p 19891:19891 \
              -p 9848:9848 \
              -v nexusgenesis-data:/app/data \
              -v nexusgenesis-logs:/app/logs \
              -e NODE_ENV=production \
              -e PORT=19891 \
              -e P2P_PORT=9848 \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              ghcr.io/${{ github.repository }}:latest

            echo "[Deploy] Waiting for health check..."
            sleep 10
            curl -f http://localhost:19891/health

            echo "[Deploy] Syncing static files to host nginx..."
            NGINX_PUBLIC=$(docker inspect nexusgenesis-nginx --format '{{ range .Mounts }}{{ if eq .Destination "/usr/share/nginx/html" }}{{ .Source }}{{ end }}{{ end }}')
            docker cp nexusgenesis-node:/app/public/index.html "$NGINX_PUBLIC/index.html"
            docker cp nexusgenesis-node:/app/public/bootstrap-dashboard.html "$NGINX_PUBLIC/bootstrap-dashboard.html"
            echo "[Deploy] Static files synced to $NGINX_PUBLIC"

            echo "[Deploy] Cleaning up old images..."
            docker image prune -f

            echo "[Deploy] Deployment successful!"