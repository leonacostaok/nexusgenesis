<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NexusGenesis Wallet</title>
<style>
:root {
  --bg: #0a0a1a;
  --card: #12122a;
  --accent: #6c5ce7;
  --accent2: #00cec9;
  --text: #e0e0e0;
  --text2: #888;
  --red: #ff6b6b;
  --green: #00d2a0;
  --border: #1e1e3a;
  --radius: 16px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); -webkit-font-smoothing: antialiased; }
.header { padding: 20px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
.logo { font-size: 20px; font-weight: 700; color: var(--accent); }
.balance-card { margin: 10px 20px; background: linear-gradient(135deg, var(--accent), #a855f7); border-radius: var(--radius); padding: 24px; position: relative; overflow: hidden; }
.balance-label { font-size: 13px; opacity: 0.85; text-transform: uppercase; letter-spacing: 1px; }
.balance-amount { font-size: 40px; font-weight: 700; margin: 8px 0; }
.balance-usd { font-size: 15px; opacity: 0.8; }
.balance-actions { display: flex; gap: 12px; margin-top: 16px; }
.btn { border: none; border-radius: 12px; padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform 0.15s, opacity 0.15s; flex: 1; text-align: center; }
.btn:active { transform: scale(0.97); opacity: 0.8; }
.btn-primary { background: white; color: var(--accent); }
.btn-outline { background: rgba(255,255,255,0.15); color: white; }
.btn-accent { background: var(--accent); color: white; }
.btn-small { padding: 8px 16px; font-size: 12px; border-radius: 8px; flex: none; }
.section { margin: 20px; }
.section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; }
.tx-list { display: flex; flex-direction: column; gap: 10px; }
.tx-item { background: var(--card); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.15s; }
.tx-item:active { background: var(--border); }
.tx-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.tx-icon.send { background: rgba(255,107,107,0.15); color: var(--red); }
.tx-icon.receive { background: rgba(0,210,160,0.15); color: var(--green); }
.tx-icon.stake { background: rgba(108,92,231,0.15); color: var(--accent); }
.tx-details { flex: 1; min-width: 0; }
.tx-name { font-size: 14px; font-weight: 500; }
.tx-date { font-size: 12px; color: var(--text2); margin-top: 2px; }
.tx-amount { font-size: 14px; font-weight: 600; text-align: right; }
.tx-amount.positive { color: var(--green); }
.tx-amount.negative { color: var(--red); }
.asset-row { display: flex; overflow-x: auto; gap: 10px; padding-bottom: 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.asset-row::-webkit-scrollbar { display: none; }
.asset-chip { flex-shrink: 0; background: var(--card); border-radius: 12px; padding: 14px 18px; min-width: 100px; text-align: center; }
.asset-symbol { font-size: 15px; font-weight: 600; }
.asset-amount { font-size: 13px; color: var(--text2); margin-top: 4px; }
.nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,26,0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; padding: 8px 0 env(safe-area-inset-bottom); z-index: 100; }
.nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 8px 0; cursor: pointer; color: var(--text2); transition: color 0.15s; font-size: 11px; gap: 4px; }
.nav-item.active { color: var(--accent); }
.nav-icon { font-size: 20px; }
.address-bar { background: var(--card); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; margin: 10px 20px; }
.address-text { flex: 1; font-family: monospace; font-size: 12px; color: var(--text2); word-break: break-all; }
.copy-btn { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
.modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: none; align-items: flex-end; justify-content: center; z-index: 200; }
.modal-overlay.show { display: flex; }
.modal { background: var(--bg); border-radius: 20px 20px 0 0; width: 100%; max-width: 500px; padding: 24px 20px; max-height: 80vh; overflow-y: auto; }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; text-align: center; }
.input-group { margin-bottom: 16px; }
.input-label { font-size: 13px; color: var(--text2); margin-bottom: 6px; display: block; }
.input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; color: var(--text); font-size: 14px; outline: none; transition: border-color 0.15s; }
.input:focus { border-color: var(--accent); }
.qr-section { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0; }
.qr-placeholder { width: 180px; height: 180px; background: var(--card); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 100px; opacity: 0.5; }
.network-badge { background: rgba(0,210,160,0.15); color: var(--green); font-size: 11px; padding: 4px 10px; border-radius: 20px; font-weight: 500; }
.page { display: none; }
.page.active { display: block; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="header">
  <div class="logo">NexusGenesis</div>
  <div class="network-badge">Mainnet</div>
</div>

<div id="page-wallet" class="page active">
  <div class="balance-card">
    <div class="balance-label">Total Balance</div>
    <div class="balance-amount" id="balance">500,000</div>
    <div class="balance-usd" id="balanceUsd">≈ $50,000.00 USD</div>
    <div class="balance-actions">
      <button class="btn btn-primary" onclick="showSendModal()">Send</button>
      <button class="btn btn-outline" onclick="showReceiveModal()">Receive</button>
      <button class="btn btn-outline" onclick="showStakeModal()">Stake</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Assets</div>
    <div class="asset-row" id="assets"></div>
  </div>

  <div class="section">
    <div class="section-title" style="display:flex;justify-content:space-between">
      Transactions
      <span style="font-size:13px;color:var(--accent);font-weight:400">View All</span>
    </div>
    <div class="tx-list" id="txList"></div>
  </div>
</div>

<div id="page-stake" class="page">
  <div class="section">
    <div class="section-title">Staking</div>
    <div class="balance-card">
      <div class="balance-label">Staked</div>
      <div class="balance-amount" style="font-size:32px" id="stakedAmount">125,000</div>
      <div class="balance-usd">APY: 12.5%</div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">Rewards</div>
    <div class="tx-list" id="rewardsList"></div>
  </div>
</div>

<div id="page-settings" class="page">
  <div class="section">
    <div class="section-title">Settings</div>
    <div class="address-bar">
      <span style="font-size:18px">🔑</span>
      <div>
        <div style="font-size:13px;font-weight:500">Wallet Address</div>
        <div class="address-text" id="walletAddress">ng1119iZwobYCzN7ceE8u7JPT...</div>
      </div>
      <button class="copy-btn" onclick="copyAddress()">Copy</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:16px">
      <button class="btn btn-accent" style="text-align:left" onclick="exportKey()">Export Private Key</button>
      <button class="btn" style="background:var(--card);color:var(--red);text-align:left">Delete Wallet</button>
    </div>
  </div>
</div>

<nav class="nav">
  <div class="nav-item active" onclick="switchPage('wallet', this)" data-page="wallet">
    <span class="nav-icon">🏠</span> Wallet
  </div>
  <div class="nav-item" onclick="switchPage('stake', this)" data-page="stake">
    <span class="nav-icon">📈</span> Stake
  </div>
  <div class="nav-item" onclick="switchPage('settings', this)" data-page="settings">
    <span class="nav-icon">⚙️</span> Settings
  </div>
</nav>

<div class="modal-overlay" id="sendModal">
  <div class="modal">
    <div class="modal-title">Send NGEN</div>
    <div class="input-group">
      <label class="input-label">Recipient Address</label>
      <input class="input" placeholder="ng1..." id="sendAddress">
    </div>
    <div class="input-group">
      <label class="input-label">Amount (NGEN)</label>
      <input class="input" type="number" placeholder="0.00" id="sendAmount" step="0.01" min="0">
    </div>
    <div style="display:flex;gap:10px;margin-top:20px">
      <button class="btn" style="background:var(--card);flex:1" onclick="hideSendModal()">Cancel</button>
      <button class="btn btn-accent" style="flex:1" onclick="sendTransaction()">Confirm</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="receiveModal">
  <div class="modal">
    <div class="modal-title">Receive NGEN</div>
    <div class="qr-section">
      <div class="qr-placeholder">📱</div>
      <div class="address-text" style="margin-top:8px;text-align:center" id="receiveAddress"></div>
      <button class="btn btn-primary btn-small" onclick="copyReceiveAddress()">Copy Address</button>
    </div>
    <button class="btn" style="background:var(--card);width:100%;margin-top:12px" onclick="hideReceiveModal()">Close</button>
  </div>
</div>

<div class="modal-overlay" id="stakeModal">
  <div class="modal">
    <div class="modal-title">Stake NGEN</div>
    <div class="input-group">
      <label class="input-label">Amount (NGEN)</label>
      <input class="input" type="number" placeholder="0.00" id="stakeAmount" step="0.01" min="0">
    </div>
    <div style="font-size:12px;color:var(--text2);margin:8px 0;text-align:center">APY: 12.5% | Lock: 30 days</div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn" style="background:var(--card);flex:1" onclick="hideStakeModal()">Cancel</button>
      <button class="btn btn-accent" style="flex:1" onclick="stakeTransaction()">Stake</button>
    </div>
  </div>
</div>

<script>
const walletData = {
  address: 'ng1119iZwobYCzN7ceE8u7JPTV6ZSfwtAvEVDAiUZaCVS1rwrvKM2k',
  balance: 500000,
  staked: 125000,
  assets: [
    { symbol: 'NGEN', amount: 500000, usdValue: 50000 },
    { symbol: 'USDT', amount: 15000, usdValue: 15000 },
    { symbol: 'ETH', amount: 2.5, usdValue: 4750 },
    { symbol: 'BTC', amount: 0.15, usdValue: 7200 }
  ],
  transactions: [
    { type: 'receive', name: 'Received from faucet', date: '2024-01-15', amount: '+500 NGEN' },
    { type: 'send', name: 'Sent to ng1abc...', date: '2024-01-14', amount: '-50 NGEN' },
    { type: 'receive', name: 'Staking reward', date: '2024-01-13', amount: '+12.5 NGEN' },
    { type: 'stake', name: 'Staked 1000 NGEN', date: '2024-01-12', amount: '-1000 NGEN' },
    { type: 'send', name: 'Sent to bridge', date: '2024-01-11', amount: '-200 NGEN' }
  ],
  rewards: [
    { type: 'receive', name: 'Staking Reward', date: '2024-01-15', amount: '+12.5 NGEN' },
    { type: 'receive', name: 'Staking Reward', date: '2024-01-14', amount: '+12.5 NGEN' },
    { type: 'receive', name: 'Validator Reward', date: '2024-01-13', amount: '+25 NGEN' }
  ]
};

function init() {
  document.getElementById('balance').textContent = walletData.balance.toLocaleString();
  document.getElementById('balanceUsd').textContent = `$ ${(walletData.balance * 0.1).toLocaleString()} USD`;
  document.getElementById('stakedAmount').textContent = walletData.staked.toLocaleString();
  document.getElementById('walletAddress').textContent = walletData.address;
  document.getElementById('receiveAddress').textContent = walletData.address;
  renderAssets();
  renderTransactions();
  renderRewards();
}

function renderAssets() {
  document.getElementById('assets').innerHTML = walletData.assets.map(a =>
    `<div class="asset-chip"><div class="asset-symbol">${a.symbol}</div><div class="asset-amount">${a.amount.toLocaleString()}</div></div>`
  ).join('');
}

function renderTransactions() {
  document.getElementById('txList').innerHTML = walletData.transactions.map(t => {
    const iconClass = t.type === 'send' ? 'send' : t.type === 'stake' ? 'stake' : 'receive';
    const icon = t.type === 'send' ? '↑' : t.type === 'stake' ? '🔒' : '↓';
    const amountClass = t.amount.startsWith('+') ? 'positive' : 'negative';
    return `<div class="tx-item"><div class="tx-icon ${iconClass}">${icon}</div><div class="tx-details"><div class="tx-name">${t.name}</div><div class="tx-date">${t.date}</div></div><div class="tx-amount ${amountClass}">${t.amount}</div></div>`;
  }).join('');
}

function renderRewards() {
  document.getElementById('rewardsList').innerHTML = walletData.rewards.map(r =>
    `<div class="tx-item"><div class="tx-icon receive">↓</div><div class="tx-details"><div class="tx-name">${r.name}</div><div class="tx-date">${r.date}</div></div><div class="tx-amount positive">${r.amount}</div></div>`
  ).join('');
}

function switchPage(page, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  if (el) el.classList.add('active');
}

function showSendModal() { document.getElementById('sendModal').classList.add('show'); }
function hideSendModal() { document.getElementById('sendModal').classList.remove('show'); }
function showReceiveModal() { document.getElementById('receiveModal').classList.add('show'); }
function hideReceiveModal() { document.getElementById('receiveModal').classList.remove('show'); }
function showStakeModal() { document.getElementById('stakeModal').classList.add('show'); }
function hideStakeModal() { document.getElementById('stakeModal').classList.remove('show'); }

function sendTransaction() {
  const addr = document.getElementById('sendAddress').value;
  const amount = document.getElementById('sendAmount').value;
  if (!addr || !amount) { alert('Please fill in all fields'); return; }
  alert(`Sending ${amount} NGEN to ${addr}...`);
  hideSendModal();
}

function stakeTransaction() {
  const amount = document.getElementById('stakeAmount').value;
  if (!amount) { alert('Please enter an amount'); return; }
  alert(`Staking ${amount} NGEN...`);
  hideStakeModal();
}

function copyAddress() {
  navigator.clipboard?.writeText(walletData.address);
  alert('Address copied!');
}

function copyReceiveAddress() {
  navigator.clipboard?.writeText(walletData.address);
  alert('Address copied!');
}

function exportKey() {
  alert('Private key export would be shown here with password authentication.');
}

init();
</script>
</body>
</html>
