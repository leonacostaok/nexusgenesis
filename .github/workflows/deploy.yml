name: Deploy to Production

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Deploy to production server (PM2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e

            APP_DIR=/opt/nexusgenesis
            cd $APP_DIR

            echo "[Deploy] Fetching latest code..."
            git fetch origin master
            git reset --hard origin/master

            echo "[Deploy] Installing production dependencies..."
            npm ci --omit=dev

            echo "[Deploy] Syncing static files to nginx..."
            NGINX_PUBLIC=/var/www/nexus-genesis.top
            if [ -d "$NGINX_PUBLIC" ]; then
              cp -f public/index.html $NGINX_PUBLIC/index.html
              cp -f public/bootstrap-dashboard.html $NGINX_PUBLIC/bootstrap-dashboard.html 2>/dev/null || true
              cp -f public/join.html $NGINX_PUBLIC/join.html 2>/dev/null || true
              cp -f public/dashboard.html $NGINX_PUBLIC/dashboard.html 2>/dev/null || true
              cp -f public/forum.html $NGINX_PUBLIC/forum.html 2>/dev/null || true
              echo "[Deploy] Static files synced to $NGINX_PUBLIC"
            else
              echo "[Deploy] WARNING: $NGINX_PUBLIC not found, skipping static file sync"
            fi

            echo "[Deploy] Restarting PM2 process: nexusgenesis-genesis..."
            pm2 restart nexusgenesis-genesis --update-env || pm2 start src/index.js --name nexusgenesis-genesis

            echo "[Deploy] Restarting Swarm Agent workers..."
            for w in atlas beacon cipher drift echo; do
              pm2 restart agent-worker-swarm-$w 2>/dev/null || echo "  - $w not running, skipping"
            done

            echo "[Deploy] Saving PM2 process list..."
            pm2 save

            echo "[Deploy] Health check..."
            sleep 8
            curl -fsS http://localhost:19891/api/v1/bootstrap/status | head -c 200 || echo "Health check failed but process started"

            echo "[Deploy] Deployment successful!"
